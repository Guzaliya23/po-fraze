    <title>По фразе — найти фильм по реплике</title>
    <meta
      name="description"
      content="Вставь фразу из кино или сериала — найдём тайтл, куда его смотреть и что похоже по атмосфере."
    />
    <link rel="canonical" href="https://guzaliya23.github.io/po-fraze/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="По фразе — найти фильм по реплике" />
    <meta
      property="og:description"
      content="Поиск кино по обрывку диалога. Легально куда смотреть и похожие по атмосфере."
    />
    <meta property="og:url" content="https://guzaliya23.github.io/po-fraze/" />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap"
      rel="stylesheet"
    />

  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <div class="glow"></div>
      <div class="haze"></div>
      <div class="stars">
        <i class="star" style="--x: 8%; --d: 0s; --t: 16s"></i>
        <i class="star" style="--x: 22%; --d: 4s; --t: 18s"></i>
        <i class="star" style="--x: 37%; --d: 9s; --t: 14s"></i>
        <i class="star" style="--x: 51%; --d: 1.5s; --t: 20s"></i>
        <i class="star" style="--x: 64%; --d: 7s; --t: 15s"></i>
        <i class="star" style="--x: 78%; --d: 11s; --t: 19s"></i>
        <i class="star alt" style="--x: 14%; --d: 5.5s; --t: 17s"></i>
        <i class="star alt" style="--x: 46%; --d: 12s; --t: 13s"></i>
        <i class="star alt" style="--x: 71%; --d: 2.8s; --t: 21s"></i>
        <i class="star" style="--x: 88%; --d: 8.4s; --t: 16s"></i>
      </div>
      <div class="vignette"></div>
      <div class="grain"></div>
    </div>

    <header class="top">
      <div class="top-inner">
        <a class="logo" href="#/">
          <span class="logo-mark" aria-hidden="true">П</span>
          По фразе
        </a>
        <nav class="nav">
          <a href="#/" data-nav="home">Поиск</a>
          <a href="#/catalog" data-nav="catalog">Каталог</a>
          <a href="#/saved" data-nav="saved">Сохранённое</a>
          <a href="#/about" data-nav="about">О проекте</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" id="hero">
        <p class="eyebrow" id="eyebrow">Каталог внутри, без аккаунта</p>
        <h1 id="headline">Вспомнил фразу —<br />назовём фильм</h1>
        <p class="lead" id="lead">
          Пиши реплику или название. Как слышал в дубляже — даже криво.
        </p>

        <form class="search" id="search-form" autocomplete="off">
          <label class="sr-only" for="query">Фраза из фильма или сериала</label>
          <input
            id="query"
            name="q"
            type="search"
            placeholder="фраза или название фильма"
          />
          <select id="type-filter" aria-label="Тип">
            <option value="all">Все</option>
            <option value="фильм">Фильмы</option>
            <option value="сериал">Сериалы</option>
          </select>
          <button type="submit">Найти</button>
        </form>
        <div class="suggest" id="suggest" hidden></div>
        <div class="chips" id="chips"></div>
      </section>

      <section id="view"></section>
    </main>

    <footer class="site-foot">
      <p id="foot">По фразе · поиск по реплике и названию</p>
      <p class="foot-links">
        <a href="#/catalog">Каталог</a>
        <a href="#/about">О проекте</a>
        <a href="#/legal">Соглашение</a>
        <a href="#/privacy">Данные</a>
        <a href="#/partners">Партнёры</a>
      </p>
    </footer>

    <script src="js/data.js?v=6"></script>

    <script src="js/catalog-max.js"></script>
    <script src="js/catalog-plus.js"></script>
    <script src="js/catalog-fresh.js"></script>
    <script src="js/catalog-next.js"></script>

    <script src="js/quotes-boost.js"></script>

    <script src="js/catalog-dedupe.js?v=2"></script>
    <script src="js/catalog-fix.js?v=2"></script>
    <script src="js/quotes-findable.js"></script>
    <script src="js/search.js?v=9"></script>
    <script src="js/store.js?v=4"></script>
